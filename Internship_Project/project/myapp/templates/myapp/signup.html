{% extends 'myapp/base.html' %}

{% block content %}

<style>

/* Background */

.signup-bg{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
position:relative;
font-family:'Segoe UI',sans-serif;
}

.signup-bg::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("https://images.unsplash.com/photo-1497032205916-ac775f0649ae") center/cover no-repeat;
filter:blur(6px);
transform:scale(1.1);
z-index:-2;
animation:bgZoom 20s infinite alternate ease-in-out;
}

@keyframes bgZoom{
0%{transform:scale(1.05);}
100%{transform:scale(1.15);}
}

.signup-bg::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:-1;
}

/* Card */

.signup-card{
width:400px;
border-radius:18px;
padding:35px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(18px);
box-shadow:0 10px 35px rgba(0,0,0,0.5);
color:white;
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Inputs */

.signup-card input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
margin-top:5px;
margin-bottom:15px;
background:rgba(255,255,255,0.25);
color:white;
}

.signup-card input:focus{
outline:none;
box-shadow:0 0 8px #28a745;
}

/* Button */

.signup-btn{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#28a745,#5ddf7a);
font-weight:bold;
color:white;
transition:0.3s;
}

.signup-btn:hover{
transform:scale(1.05);
box-shadow:0 5px 20px rgba(40,167,69,0.6);
}

/* Errors */

ul.errorlist{
list-style:none;
padding:0;
margin-bottom:10px;
}

ul.errorlist li{
background:rgba(255,0,0,0.25);
padding:8px;
border-radius:6px;
margin-bottom:5px;
}

</style>


<div class="signup-bg">

<div class="signup-card">

<h3 class="text-center mb-4">Create Account</h3>

<form method="post">
{% csrf_token %}

{{ form.errors }}

<label>Username</label>
{{ form.username }}

<label>Password</label>
{{ form.password1 }}

<label>Confirm Password</label>
{{ form.password2 }}

<button type="submit" class="signup-btn">
Signup
</button>

</form>

<p class="text-center mt-3">
Already have an account?
<a href="{% url 'login' %}" style="color:#7ed6ff;">Login</a>
</p>

</div>

</div>

{% endblock %}
