{% extends 'myapp/base.html' %}
{% load static %}

{% block content %}

<style>

/* Login Page Background */

.login-page{
background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba");
background-size:cover;
background-position:center;
min-height:80vh;
width:80vw;
display:flex;
justify-content:center;
align-items:center;
animation:bgMove 25s infinite alternate;
background-position:left center;
}

@keyframes bgMove{
0%{background-position:center;}
100%{background-position:top;}
}

/* Dark overlay container */

.overlay{
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
}

/* Login Card */

.login-card{
width:420px;
background:rgba(0,0,0,0.85);
padding:40px;
border-radius:12px;
box-shadow:0 15px 35px rgba(0,0,0,0.6);
color:white;
backdrop-filter:blur(8px);
margin:auto;
animation:fadeUp 1s ease;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Title */

.login-title{
text-align:center;
margin-bottom:25px;
font-weight:bold;
font-size:26px;
letter-spacing:1px;
}

/* Inputs */

.login-card input{
width:100%;
padding:12px;
border-radius:8px;
border:none;
margin-bottom:15px;
background:rgba(255,255,255,0.15);
color:white;
transition:0.3s;
}

.login-card input::placeholder{
color:#ccc;
}

.login-card input:focus{
outline:none;
background:rgba(255,255,255,0.25);
box-shadow:0 0 8px #ff4b5c;
}

/* Button */

.login-btn{
width:100%;
padding:12px;
font-weight:bold;
border:none;
border-radius:8px;
background:linear-gradient(45deg,#ff4b5c,#ff1e3c);
color:white;
transition:0.3s;
}

.login-btn:hover{
transform:scale(1.05);
box-shadow:0 5px 20px rgba(255,75,92,0.6);
}

/* Signup Link */

.signup-link{
text-align:center;
margin-top:15px;
font-size:14px;
}

.signup-link a{
color:#ff4b5c;
font-weight:bold;
}

.signup-link a:hover{
text-decoration:underline;
}

</style>

<div class="login-page">

<div class="overlay">

<div class="login-card">

<h3 class="login-title">Login</h3>

{% if form.errors %}

<div class="alert alert-danger">
"Invalid credentials. Please sign up if you don't have an account." 
</div>
{% endif %}

<form method="post">
{% csrf_token %}

<div class="mb-3">
<label class="form-label">Username</label>
{{ form.username }}
</div>

<div class="mb-3">
<label class="form-label">Password</label>
{{ form.password }}
</div>

<button type="submit" class="btn btn-danger login-btn">
Login
</button>

</form>

<p class="text-center mt-3">
Don't have an account?
<a href="{% url 'signup' %}">Signup</a>
</p>

</div>

</div>

</div>

{% endblock %}
